<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <i class="pi pi-cog"></i>
      <span>Lubricentro</span>
    </div>

    <nav class="nav">
      @for (item of items; track item.ruta) {
        <a
          [routerLink]="item.ruta"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.ruta === '/' }"
        >
          <i [class]="item.icono"></i>
          <span>{{ item.etiqueta }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="spacer"></div>
      @if (usuario(); as u) {
        <div class="user">
          <p-tag [value]="u.rol" severity="info" />
          <span class="nombre">{{ u.nombre }}</span>
          <p-avatar [label]="iniciales(u.nombre)" shape="circle" />
          <button
            pButton
            icon="pi pi-sign-out"
            text
            severity="secondary"
            (click)="cerrarSesion()"
            title="Cerrar sesion"
          ></button>
        </div>
      }
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>

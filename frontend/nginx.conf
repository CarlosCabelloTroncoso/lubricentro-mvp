# Sirve el build de Angular y hace de proxy reverso hacia la API.
# Mismo origen para web y API -> sin CORS que configurar (ver decisiones
# de arquitectura: nginx.frontend.CLI-proxy en dev cumplen el mismo rol).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Assets versionados con hash en el nombre (chunk-XXXX.js): cacheables
    # indefinidamente sin riesgo de servir una version vieja.
    location ~* \.(?:js|css|svg|woff2?|ttf|eot|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy a la API. Se preserva el prefijo /api porque proxy_pass no
    # define un path propio (Express monta el router justamente en /api).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La cookie de sesion (HttpOnly) debe viajar sin que nginx la reescriba.
        proxy_cookie_path / /;
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html para
    # que el router de Angular la resuelva del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

services:
  db:
    image: mysql:8.4.11
    container_name: lubricentro-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    ports:
      # 3307 en el host: el puerto 3306 ya lo ocupa un MySQL local en Windows.
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ./backend
    container_name: lubricentro-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Topologia de la red interna de Docker: sobreescribe lo que dice el .env,
      # que apunta a localhost:3307 para el modo desarrollo.
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    container_name: lubricentro-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  db_data:
